version: baseline-2.3
policy: At most half documented capacity; sandbox and service share the same IP budget.
  Unknown endpoint-specific limits require live documentation verification, never
  invented defaults.
limits:
- provider: sec.gov
  documented_requests_per_s: 10
  tank_max_requests_per_s: 5
  basis: "02 \xA711"
- provider: binance.spot
  documented_weight_per_min: 6000
  tank_max_weight_per_min: 3000
  observed_header: X-MBX-USED-WEIGHT-1M
  basis: "02 \xA74.1"
- provider: binance.usdm
  documented_weight_per_min: 2400
  tank_max_weight_per_min: 1200
  basis: "02 \xA74.2"
- provider: coinbase
  tank_max_requests_per_s: 5
  basis: "02 \xA74.3"
- provider: kraken
  tank_max_requests_per_s: 1
  basis: "02 \xA74.6"
- provider: okx
