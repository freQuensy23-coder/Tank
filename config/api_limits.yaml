    11. Scope keys must be preserved."
  source_ref: https://www.okx.com/docs-v5/en/
  source_content_sha256: 4f64bdcdb7a52af2bd1a8e1e1e6c4beddaf049b78e01e93b6e614201e235cc13
  verified_at: '2026-10-17T18:42:31.558153+00:00'
  endpoint_limits:
  - path: /api/v5/market/books
    documented_requests: 40
    period_s: 2
    tank_request_budget: 20
    scope: IP
  - path: /api/v5/market/trades
    documented_requests: 100
    period_s: 2
    tank_request_budget: 50
    scope: IP
  - path: /api/v5/market/history-trades
    documented_requests: 20
    period_s: 2
    tank_request_budget: 10
    scope: IP
  - path: /api/v5/market/candles
    documented_requests: 40
    period_s: 2
    tank_request_budget: 20
    scope: IP
  - path: /api/v5/market/history-candles
    documented_requests: 20
    period_s: 2
    tank_request_budget: 10
    scope: IP
  - path: /api/v5/public/open-interest
    documented_requests: 20
    period_s: 2
    tank_request_budget: 10
    scope: IP_INSTRUMENT
  - path: /api/v5/public/funding-rate
    documented_requests: 10
    period_s: 2
    tank_request_budget: 5
    scope: IP_INSTRUMENT
  - path: /api/v5/public/funding-rate-history
    documented_requests: 10
    period_s: 2
    tank_request_budget: 5
    scope: IP_INSTRUMENT
  - path: /api/v5/public/instruments
    documented_requests: 20
    period_s: 2
    tank_request_budget: 10
    scope: IP_INSTRUMENT_TYPE
  - path: /api/v5/market/tickers
    documented_requests: 20
    period_s: 2
    tank_request_budget: 10
    scope: IP
  - path: /api/v5/market/ticker
    documented_requests: 20
    period_s: 2
    tank_request_budget: 10
    scope: IP
  - path: /api/v5/public/mark-price
    documented_requests: 10
    period_s: 2
    tank_request_budget: 5
    scope: IP_INSTRUMENT
  - path: /api/v5/market/mark-price-candles
    documented_requests: 20
    period_s: 2
    tank_request_budget: 10
    scope: IP
  - path: /api/v5/market/index-tickers
    documented_requests: 20
    period_s: 2
    tank_request_budget: 10
    scope: IP
- provider: bybit
  basis: Official default HTTP IP limit; preserve any lower endpoint-specific returned
    limit.
  documented_requests: 600
  period_s: 5
  tank_request_budget: 300
  scope: IP
  source_ref: https://bybit-exchange.github.io/docs/v5/rate-limit
  verified_at: '2026-10-17T18:42:31.558153+00:00'
- provider: hyperliquid
  basis: Official aggregate request-weight cap and info request groups, with response-size
    weights; per-user quota is separate and does not apply to public requests.
  documented_weight_per_min: 1200
  tank_max_weight_per_min: 600
  scope: IP
  source_ref: https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/api/rate-limits-and-user-limits
  verified_at: '2026-10-17T18:42:31.558153+00:00'
  request_weights:
    l2Book: 2
    allMids: 2
    meta: 20
    metaAndAssetCtxs: 20
    fundingHistory: 20
    recentTrades: 20
    candleSnapshot: 20
    userRole: 60
  response_size_extra_weights:
    fundingHistory: 1 per20returned items
    recentTrades: 1 per20returned items
    candleSnapshot: 1 per60returned items
  inference_limits:
  - recentTrades has no documented maximum response count. Adapter serializes calls
    and debits actual returned-size weight before releasing the provider slot; strict
    size-dependent precharge cannot be proven without a provider bound.
- provider: duckduckgo
  client: ddgs==9.16.0
  backend: duckduckgo
  minimum_request_spacing_s: 2
  retry_delays_s:
  - 5
  - 15
  - 45
  cost_usd: 0
  api_key_required: false
  basis: "Current PRD D9 and HLD \xA79; no alternate backend or paid fallback."
- provider: etherscan
  tier: FREE
  documented_requests_per_s: 3
  documented_requests_per_day: 100000
  tank_max_requests_per_s: 1.5
  tank_max_requests_per_day: 50000
  source_ref: https://docs.etherscan.io/resources/rate-limits
  verified_at: '2026-10-17T18:42:31.558153+00:00'
  scope: API_KEY
  inference_limits:
  - Free access supports selected chains only; rejected chain responses are unavailable,
    never zero.

- provider: binance.www
  host: www.binance.com
  policy_kind: CLIENT_PROTECTION
  documentation_status: NOT_CAPTURED
  documented_requests: null
  tank_request_budget: 60
  period_s: 60
  scope: IP
  basis: Existing internal capture-client protection at 60 requests per minute; no provider-documented quota has been captured.
- provider: binance.vision
  host: data.binance.vision
  policy_kind: CLIENT_PROTECTION
  documentation_status: NOT_CAPTURED
  documented_requests: null
  tank_request_budget: 10
  period_s: 1
  scope: IP
  basis: Existing internal capture-client protection at 10 requests per second; no provider-documented quota has been captured.
