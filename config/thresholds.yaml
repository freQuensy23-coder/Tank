version: baseline-2.5
# Uncalibrated midpoint, user decision 2026-10-20, see todo.md: calibrate on labeled real news later (03 §3.1, 01 V0-B).
filter_cutoff: 0.5
routing_cutoff: 0.5
filter_model: typesafe/jev-1.13
calibration_required:
- 'filter_cutoff: V0-B highest cutoff retaining >=95% relevant items (uncalibrated midpoint until then)'
- 'routing_cutoff: V0-B highest cutoff with precision and recall >=0.90 (uncalibrated midpoint until then)'
- 'tank_agent_statement_timeout_ms: V0-G'
- 'tank_agent_connection_limit: V0-G'
tank_agent_statement_timeout_ms: null
tank_agent_connection_limit: null
normal_range_quantiles:
- 0.025
- 0.975
significant_flow_sigma: 2
freshness_hours:
  FRESH: 1
  NORMAL: 4
  MEDIUM: 8
  POOR: 24
  OLD: 48
min_spot_venues: 2
large_ticket_usd: 100000
size_buckets_usd:
- 1000
- 10000
- 100000
- 1000000
oi_sync_tolerance_s: 60
book_interval_s: 10
impact_tiers_usd:
- 100000
- 1000000
- 5000000
depth_band_pct: 1
refill_window_s: 60
resilience_window_min: 15
absorption_min_bursts: 2
history_min_days: 7
beta_blume_weight: 0.6666666666666666
event_close_days: 7
call_expiry_days: 7
update_rate_limit_s: 900
card_max_chars: 3500
heartbeat_utc: 08:00
escalated_interval_s: 15
escalation_expiry_s: 7200
hot_token_cap: 15
base_kline_interval_s: 60
base_oi_funding_interval_s: 300
hot_oi_funding_interval_s: 60
base_retention_days: 90
trades_retention_days: 30
jobs_retention_days: 30
backup_snapshots_kept: 3  # until the backup has its own disk (lead ruling 2026-10-20)
# Order-book summaries (03 §14): 72 h, no event-window exception.
book_summary_retention_hours: 72
# 24h tickers: a 24 h volume needs no 20 s samples.
hot_ticker_interval_s: 300
quiet_socket_s: 30
archive_retry_s: 3600
routing_window_days: 3
market_context_rule: normal_range
