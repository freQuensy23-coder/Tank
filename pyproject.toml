[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tank-v0"
version = "0.1.0"
description = "Tank V0 Major Event Hunter"
requires-python = ">=3.12,<3.13"
dependencies = [
  "click>=8.1,<9",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "httpx-sse>=0.4,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "feedparser>=6,<7",
  "selectolax>=0.3,<1",
  "PyYAML>=6,<7",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "websockets>=14,<17",
  "playwright>=1.49,<2",
  "zstandard>=0.23,<1",
  "aiohttp>=3.11,<4",
  "ddgs==9.16.0",
  "sniffio>=1.3,<2",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-timeout>=2.4,<3", "pytest-xdist>=3.8,<4", "respx>=0.22,<1", "ruff>=0.9,<1"]
[project.scripts]
tank = "tank.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/tank"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers"
timeout = 10
timeout_method = "signal"
junit_duration_report = "total"
markers = [
  "integration: composed services or real process, database, browser, HTTP-listener, or retained-capture contracts",
  "postgres: requires an explicitly configured, disposable PostgreSQL test database",
  "browser: requires the opt-in local Chromium fixture",
  "node: requires a local Node runtime or explicitly prepared upstream Node dependencies",
  "process: executes a local Git, Python, or Node child process",
  "historical: requires retained historical capture fixtures outside small unit inputs",
]
[tool.ruff]
target-version = "py312"
line-length = 110
