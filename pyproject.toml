[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tank-v0"
version = "0.1.0"
description = "Tank V0 Major Event Hunter"
requires-python = ">=3.13,<3.14"
dependencies = [
  "click>=8.1,<9",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "httpx-sse>=0.4,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "feedparser>=6,<7",
  "selectolax>=0.3,<1",
  "PyYAML>=6,<7",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "websockets>=14,<17",
  "zstandard>=0.23,<1",
  "aiohttp>=3.11,<4",
  "ddgs==9.16.0",
  "sniffio>=1.3,<2",
  "telegramify-markdown==1.4.1",
]
[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-timeout==2.4.0", "pytest-xdist==3.8.0", "respx==0.23.1", "ruff==0.17.1", "mypy==1.20.2", "types-PyYAML==6.0.12.20260906"]
[project.scripts]
tank = "tank.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/tank"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers"
timeout = 10
timeout_method = "signal"
junit_duration_report = "total"
markers = [
  "integration: composed services or real process, database, HTTP-listener, or retained-capture contracts",
  "postgres: requires an explicitly configured, disposable PostgreSQL test database",
  "node: requires a local Node runtime or explicitly prepared upstream Node dependencies",
  "process: executes a local Git, Python, or Node child process",
  "historical: requires retained historical capture fixtures outside small unit inputs",
]
[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["docs", "audit", "fixture_check", "diagrams", "upstream", "vendor", "history", "capture/testdata"]


[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID", "PIE", "RUF100", "ERA"]
ignore = ["E501", "B023"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["SIM115", "E402", "B904"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations" = { msg = "Python 3.13+: postponed annotations are not needed" }
"typing.Optional" = { msg = "use X | None" }
"typing.Union" = { msg = "use X | Y" }
"typing.List" = { msg = "use list" }
"typing.Dict" = { msg = "use dict" }
"typing.Tuple" = { msg = "use tuple" }
"typing.Set" = { msg = "use set" }

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["tank.storage"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["tank.search"]
disable_error_code = ["assignment", "override"]
