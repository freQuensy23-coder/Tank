services:
  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    networks:
      tank-net:
        ipv4_address: 172.30.60.11
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SERVER_PROTOCOL: http
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?}
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: tank
      GF_DATABASE_USER: tank_grafana_store
      GF_DATABASE_PASSWORD: ${GRAFANA_STORE_PASSWORD:?}
      GF_DATABASE_SSL_MODE: disable
      GF_DATABASE_MAX_OPEN_CONN: "8"
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:?}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/var/lib/tank-dashboards:ro
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 5s
      timeout: 3s
      retries: 24
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: '5'}
