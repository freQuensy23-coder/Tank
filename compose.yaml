name: tank
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'
services:
  postgres:
    image: ghcr.io/frequensy23-coder/tank/tank-postgres:${TANK_VERSION:?}
    restart: unless-stopped
    shm_size: 2g
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TANK_DB_PASSWORD: ${TANK_DB_PASSWORD:?}
      OMA_DB_PASSWORD: ${OMA_DB_PASSWORD:?}
      TANK_AGENT_DB_PASSWORD: ${TANK_AGENT_DB_PASSWORD:?}
      TANK_REPLAY_AGENT_DB_PASSWORD: ${TANK_REPLAY_AGENT_DB_PASSWORD:?}
    volumes:
    - pg-data:/var/lib/postgresql/data
    logging: *logging
    networks: [tank-net]
  clickhouse:
    image: ghcr.io/frequensy23-coder/tank/tank-clickhouse:${TANK_VERSION:?}
    restart: unless-stopped
    environment:
      TANK_DB_PASSWORD: ${TANK_DB_PASSWORD:?}
      TANK_AGENT_DB_PASSWORD: ${TANK_AGENT_DB_PASSWORD:?}
    volumes:
    - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    logging: *logging
    networks: [tank-net]
  openma:
    image: ghcr.io/frequensy23-coder/tank/tank-openma:${TANK_VERSION:?}
    restart: unless-stopped
    environment:
      OMA_DB_PASSWORD: ${OMA_DB_PASSWORD:?}
      OMA_API_KEY: ${OMA_API_KEY:?}
      OMA_ROOT_SECRET: ${OMA_ROOT_SECRET:?}
      OMA_AUTH_SECRET: ${OMA_AUTH_SECRET:?}
      TANK_AGENT_DB_PASSWORD: ${TANK_AGENT_DB_PASSWORD:?}
      TANK_REPLAY_AGENT_DB_PASSWORD: ${TANK_REPLAY_AGENT_DB_PASSWORD:?}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:?}
      LITEBOX_CPUS: ${TANK_SANDBOX_CPUS:?}
      LITEBOX_MEMORY_MIB: ${TANK_SANDBOX_MEMORY_MIB:?}
    devices:
    - /dev/kvm:/dev/kvm
    group_add:
    - ${KVM_GID:?}
    volumes:
    - openma-data:/app/data
    - sealed-replay-evidence:/app/replay-evidence:ro
    depends_on:
      postgres: {condition: service_healthy}
    logging: *logging
    networks:
      tank-net:
        ipv4_address: 172.30.60.10
  tank-capture:
    image: ghcr.io/frequensy23-coder/tank/tank-capture:${TANK_VERSION:?}
    restart: unless-stopped
    init: true
    environment:
      TANK_DB_PASSWORD: ${TANK_DB_PASSWORD:?}
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    logging: *logging
    networks: [tank-net]
  tank:
    image: ghcr.io/frequensy23-coder/tank/tank:${TANK_VERSION:?}
    restart: unless-stopped
    init: true
    environment:
      TANK_DB_PASSWORD: ${TANK_DB_PASSWORD:?}
      OMA_DB_PASSWORD: ${OMA_DB_PASSWORD:?}
      OMA_API_KEY: ${OMA_API_KEY:?}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      TANK_FOUNDRY_API_KEY: ${TANK_FOUNDRY_API_KEY:?}
      TANK_FOUNDRY_ENDPOINT: ${TANK_FOUNDRY_ENDPOINT:-https://alexeym-4644-resource.services.ai.azure.com}
      TANK_FOUNDRY_DEPLOYMENT: ${TANK_FOUNDRY_DEPLOYMENT:-decision-1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      TANK_OPS_PROGRESS_ENABLED: ${TANK_OPS_PROGRESS_ENABLED:-true}
      TANK_OPS_PROGRESS_DELAY_S: ${TANK_OPS_PROGRESS_DELAY_S:-15}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:?}
      CODEX_GATEWAY_KEY: ${CODEX_GATEWAY_KEY:?}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:?}
    volumes:
    - tank-data:/data
    - sealed-replay-evidence:/data/replay/evidence
    - codex-auth:/codex-auth
    - backup:/backup
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      openma: {condition: service_healthy}
    logging: *logging
    networks: [tank-net]
volumes:
  tank-data: {}
  codex-auth: {}
  pg-data: {}
  clickhouse-data: {}
  openma-data: {}
  sealed-replay-evidence: {}
  backup:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${TANK_BACKUP_PATH:?}
networks:
  tank-net:
    driver: bridge
    ipam:
      config:
      - subnet: 172.30.60.0/24
