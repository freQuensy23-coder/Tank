services:
  grafana:
    networks: [test-http]
  postgres:
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TANK_DB_PASSWORD: ${TANK_DB_PASSWORD:?}
      OMA_DB_PASSWORD: ${OMA_DB_PASSWORD:?}
      TANK_AGENT_DB_PASSWORD: ${TANK_AGENT_DB_PASSWORD:?}
      TANK_REPLAY_AGENT_DB_PASSWORD: ${TANK_REPLAY_AGENT_DB_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, hba_file=/etc/postgresql/tank-pg_hba.conf, -c, max_locks_per_transaction=256]
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-tank.sh:ro
      - ./src/tank/migrations:/test-migrations:ro
    networks: [tank-net]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d tank && gosu postgres psql -XAt -d tank -c "SELECT 1"']
      interval: 1s
      timeout: 3s
      retries: 45
networks:
  test-http: {}
  tank-net:
    internal: true
    ipam:
      config:
        - subnet: 172.30.60.0/24
