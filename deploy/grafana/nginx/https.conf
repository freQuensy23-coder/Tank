server {
    listen 0.0.0.0:80;
    listen [::]:80;
    server_name @HOST@;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/tank-grafana-nginx/webroot;
        try_files $uri =404;
    }

    location / {
        return 308 https://@HOST@$request_uri;
    }
}

server {
    listen 0.0.0.0:443 ssl;
    listen [::]:443 ssl;
    server_name @HOST@;
    ssl_certificate /var/lib/tank-grafana-nginx/certbot/config/live/@HOST@/fullchain.pem;
    ssl_certificate_key /var/lib/tank-grafana-nginx/certbot/config/live/@HOST@/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_set_header Host @HOST@;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host @HOST@;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
