name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sandbox-qualification:
        description: Run isolated amd64 KVM and vendored sandbox upgrade qualification
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  budget:
    name: CI 4 minute budget
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.7"
          python-version: "3.13.13"
          enable-cache: true
      - run: uv sync --python 3.13.13 --frozen --extra dev
      - name: Enforce the complete MR feedback budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --frozen --extra dev python scripts/ci/ci_budget.py

  lint-python:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 4 || 5 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.7"
          python-version: "3.13.13"
          enable-cache: true
      - run: uv sync --python 3.13.13 --frozen --extra dev
      - name: Source comment policy
        run: uv run --frozen --extra dev python scripts/ci/no_comments.py src tests scripts deploy capture apify/x-reader
      - name: Python lint
        run: uv run --frozen --extra dev ruff check src tests scripts deploy apify/x-reader
      - name: Python format
        run: uv run --frozen --extra dev ruff format --check src tests scripts deploy apify/x-reader
      - name: CI policy regressions
        run: uv run --frozen --extra dev pytest -q tests/test_ci_no_comments.py

  lint-go:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 4 || 10 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.14"
          cache-dependency-path: capture/go.sum
      - name: Go format
        working-directory: capture
        run: test -z "$(gofmt -l .)"
      - name: Go vet
        working-directory: capture
        run: go vet ./...
      - name: Install pinned golangci-lint
        run: |
          curl --fail --silent --show-error --location https://github.com/golangci/golangci-lint/releases/download/v2.5.0/golangci-lint-2.5.0-linux-amd64.tar.gz --output "$RUNNER_TEMP/golangci-lint.tar.gz"
          printf '%s  %s\n' c77313a77e19b06123962c411d9943cc0d092bbec76b956104d18964e274902e "$RUNNER_TEMP/golangci-lint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/golangci-lint.tar.gz" --directory "$RUNNER_TEMP" golangci-lint-2.5.0-linux-amd64/golangci-lint
      - name: Go lint
        working-directory: capture
        run: '"$RUNNER_TEMP/golangci-lint-2.5.0-linux-amd64/golangci-lint" run ./...'

  mypy:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 4 || 5 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.7"
          python-version: "3.13.13"
          enable-cache: true
      - run: uv sync --python 3.13.13 --frozen --extra dev --group x-reader
      - run: uv run --frozen --extra dev mypy
      - name: Check completed foundation source family strictly
        env:
          MYPYPATH: src:tests
        run: >-
          uv run --frozen --extra dev mypy --strict --follow-imports=silent --explicit-package-bases
          src/tank/storage.py src/tank/retention.py src/tank/search.py src/tank/market_storage.py
          src/tank/market_codec.py src/tank/clickhouse_market.py src/tank/models.py src/tank/market_schema.py
          src/tank/settings.py src/tank/util.py src/tank/time_precision.py src/tank/logging.py
          src/tank/backup.py src/tank/job_repository.py src/tank/repository.py
          src/tank/source_repository.py src/tank/contracts
          src/tank/market/flow.py src/tank/market/trade_contracts.py
      - name: Check completed foundation tests strictly
        env:
          MYPYPATH: src:tests
        run: >-
          uv run --frozen --extra dev mypy --config-file scripts/ci/mypy-foundation-tests.ini
          tests/foundation_helpers.py tests/test_storage.py tests/test_storage_lifecycle.py
          tests/test_storage_time_precision.py tests/test_storage_migration_lock.py tests/test_storage_memory_locks.py
          tests/test_storage_typed_market.py tests/test_clickhouse_market.py tests/test_settings.py
          tests/test_config.py tests/test_config_version.py tests/test_logging.py tests/test_backup_retention.py
          tests/test_time_precision.py tests/test_search.py tests/test_offline_settings_defaults.py
          tests/test_foundation_contracts.py tests/test_flow_contracts.py tests/test_storage_native_flow.py
      - name: Check completed scheduling and ownership protocols strictly
        env:
          MYPYPATH: src:tests
        run: >-
          uv run --frozen --extra dev mypy --config-file scripts/ci/mypy-foundation-tests.ini
          src/tank/analysis/reaction_scheduling.py src/tank/analysis/price_reference.py
          src/tank/analysis/statistics_contracts.py src/tank/agents/context_binding.py
          src/tank/agents/session_ownership.py tests/test_truth_price_freshness.py
          tests/test_truth_percentile_precision.py tests/test_statistics_contracts.py
          tests/test_runtime_scheduling_composition.py tests/scheduling_support.py
          tests/scheduler_support.py tests/test_scheduler_support.py
      - name: Check completed context admission and metadata contracts strictly
        env:
          MYPYPATH: src:tests
        run: >-
          uv run --frozen --extra dev mypy --config-file scripts/ci/mypy-foundation-tests.ini
          src/tank/agents/context.py src/tank/agents/context_records.py
          src/tank/contracts/session_admission.py src/tank/agents/admission.py
          src/tank/agents/admission_repository.py src/tank/agents/session_contracts.py
          src/tank/runtime_contracts.py src/tank/contracts/source_checkpoints.py
          src/tank/sources/instruments.py src/tank/analysis/condition_graph_contracts.py
          tests/test_context_record_contracts.py tests/test_agents_context_binding.py
          tests/test_session_admission_contracts.py tests/agent_configuration_fixtures.py
          tests/test_source_instrument_snapshots.py tests/source_support.py
          tests/test_condition_graph_contracts.py
      - name: Check completed unit partition and full-union gates strictly
        env:
          MYPYPATH: src:tests
        run: >-
          uv run --frozen --extra dev mypy --config-file scripts/ci/mypy-foundation-tests.ini
          scripts/ci/unit_contracts.py scripts/ci/unit_reports.py scripts/ci/build_unit_plan.py
          scripts/ci/collect_units.py scripts/ci/unit_shard.py scripts/ci/check_unit_results.py
          tests/test_ci_unit_shards.py
      - name: Check the complete schema renderer strictly
        env:
          MYPYPATH: src:tests
        run: >-
          uv run --frozen --extra dev mypy --config-file scripts/ci/mypy-foundation-tests.ini
          scripts/render_db_schema.py tests/test_render_db_schema.py
      - name: Check frozen public history dependency setup strictly
        env:
          MYPYPATH: src:tests:.
        run: >-
          uv run --frozen --extra dev mypy --config-file scripts/ci/mypy-foundation-tests.ini
          scripts/openma_history/models.py scripts/openma_history/manifest.py
          scripts/openma_history/setup.py tests/test_openma_history_setup.py
      - name: Check completed Decision-1 classifier and routing pipeline strictly
        env:
          MYPYPATH: src:tests
        run: >-
          uv run --frozen --extra dev mypy --config-file scripts/ci/mypy-foundation-tests.ini
          src/tank/agents/decision.py src/tank/agents/classification.py
          src/tank/agents/routing.py src/tank/agents/pipeline.py src/tank/agents/pipeline_contracts.py
          tests/test_agents_decision.py tests/agent_source_fixtures.py
          tests/agent_configuration_fixtures.py tests/test_agents_classification.py
          tests/test_agents_required_versions.py tests/test_agents_scalar_flags.py
          tests/test_agents_jev_contracts.py
          tests/test_pipeline_postgres.py
      - name: Check completed native readback contracts strictly
        env:
          MYPYPATH: src:tests
        run: >-
          uv run --frozen --extra dev mypy --config-file scripts/ci/mypy-foundation-tests.ini
          src/tank/contracts/openma.py src/tank/contracts/native_readback.py
          src/tank/agents/provenance.py src/tank/agents/native_sessions.py
          src/tank/agents/native_readback.py
          src/tank/agents/session_contracts.py src/tank/contracts/session_admission.py
          tests/native_session_fixtures.py tests/test_native_readback_contracts.py
          tests/test_native_tool_contracts.py tests/test_native_tool_readback.py
          tests/test_agents_scalar_flags.py
      - name: Check completed native transport and outbound contracts strictly
        env:
          MYPYPATH: src:tests
        run: >-
          uv run --frozen --extra dev mypy --config-file scripts/ci/mypy-foundation-tests.ini
          src/tank/agents/native_transport.py src/tank/agents/native_retry.py
          src/tank/agents/input_ownership.py src/tank/agents/outbound_inputs.py
          src/tank/agents/session_ownership.py tests/test_native_transport_contracts.py
          tests/test_session_native_lineage.py tests/test_session_outbound_intents.py
      - name: Check completed source error layer contracts strictly
        env:
          MYPYPATH: src:tests
        run: >-
          uv run --frozen --extra dev mypy --config-file scripts/ci/mypy-foundation-tests.ini
          src/tank/contracts/source_errors.py src/tank/diagnostic_documents.py
          src/tank/sources/x_diagnostics.py tests/test_x_diagnostic_admission.py
          tests/test_source_error_layering.py
      - name: Check completed quality module families strictly
        env:
          MYPYPATH: src:tests
        run: >-
          uv run --frozen --extra dev mypy --strict --follow-imports=silent --explicit-package-bases
          scripts/ci scripts/capture/gen_schema.py scripts/capture/gen_pyvectors.py scripts/capture/parity.py
          deploy/openma_lifecycle/native_network_probe.py
          tests/test_ci_budget.py tests/test_ci_go_results.py tests/test_capture_parity.py tests/test_capture_parity_contracts.py tests/test_native_network_probe.py tests/test_deploy.py
          tests/bootstrap_support.py tests/test_bootstrap_support.py tests/test_refactor_inventory.py
          tests/test_actor_package_closure.py
      - name: Check offline native test boundaries strictly
        env:
          MYPYPATH: src:tests
        run: >-
          uv run --frozen --extra dev mypy --config-file scripts/ci/mypy-foundation-tests.ini
          tests/conftest.py tests/test_offline_native_contracts.py tests/test_offline_boundary.py
      - name: Check captured configuration helpers strictly
        env:
          MYPYPATH: src:tests
        run: >-
          uv run --frozen --extra dev mypy --config-file scripts/ci/mypy-foundation-tests.ini
          tests/configuration_support.py tests/test_configuration_support.py tests/http_support.py

      - name: Verify the frozen actor-only dependency export
        run: uv run --frozen --extra dev --group x-reader python scripts/ci/check_actor_dependencies.py --root .
      - name: Check completed standalone actor contracts strictly
        env:
          MYPYPATH: apify/x-reader:src:tests
        run: >-
          uv run --frozen --extra dev --group x-reader mypy
          --config-file scripts/ci/mypy-foundation-tests.ini
          apify/x-reader/actor_contracts.py apify/x-reader/direct_fetch.py
          apify/x-reader/public_profile.py apify/x-reader/main.py
          tests/test_x_reader_contracts.py
      - name: Typecheck the versioned worker
        run: uv run --frozen --extra dev --group x-reader mypy apify/x-reader
      - name: Check the complete typed publisher and owned caller contracts strictly
        env:
          MYPYPATH: src:tests
        run: >-
          uv run --frozen --extra dev --group x-reader mypy
          --config-file scripts/ci/mypy-foundation-tests.ini
          src/tank/deployment tests/test_publisher_*.py tests/publisher_*.py
          tests/test_apify_deploy.py tests/test_actor_package_closure.py

  test:
    uses: ./.github/workflows/test-suite.yml

  capture:
    uses: ./.github/workflows/capture.yml

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 4 || 30 }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tank
            context: .
            file: Dockerfile
            content: Dockerfile .dockerignore pyproject.toml uv.lock src config
          - image: tank-capture
            context: .
            file: capture/Dockerfile
            content: capture config
          - image: tank-openma
            context: ./vendor/openma
            file: vendor/openma/Dockerfile
            build_args: SKIP_CONSOLE=1
            content: vendor/openma deploy/sandbox.Dockerfile deploy/sandbox.Dockerfile.dockerignore deploy/openma_browser
          - image: tank-postgres
            context: ./deploy/postgres
            file: deploy/postgres/Dockerfile
            content: deploy/postgres
          - image: tank-clickhouse
            context: ./deploy/clickhouse
            file: deploy/clickhouse/Dockerfile
            content: deploy/clickhouse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        env:
          IMAGE_NAME: ${{ matrix.image }}
          CONTENT: ${{ matrix.content }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$IMAGE_NAME"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          content=$(for path in $CONTENT; do echo "$path $(git rev-parse "HEAD:$path" 2>/dev/null || echo missing)"; done | sha256sum | cut -d' ' -f1)
          echo "content=$content" >> "$GITHUB_OUTPUT"
      - name: Build the sandbox rootfs baked into OpenMA
        if: matrix.image == 'tank-openma'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/sandbox.Dockerfile
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/sandbox.tar,name=tank-analysis:server-amd64
          cache-from: type=gha,scope=tank-sandbox
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=tank-sandbox' || '' }}
      - name: Unpack the sandbox OCI layout
        if: matrix.image == 'tank-openma'
        run: |
          mkdir -p "$RUNNER_TEMP/sandbox-oci"
          tar -xf "$RUNNER_TEMP/sandbox.tar" -C "$RUNNER_TEMP/sandbox-oci"
          test "$(cat "$RUNNER_TEMP/sandbox-oci/oci-layout")" = '{"imageLayoutVersion":"1.0.0"}'
          test -f "$RUNNER_TEMP/sandbox-oci/index.json"
          rm "$RUNNER_TEMP/sandbox.tar"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          build-contexts: ${{ matrix.image == 'tank-openma' && format('sandbox={0}/sandbox-oci', runner.temp) || '' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.tank.content=${{ steps.name.outputs.content }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}

  sandbox-kvm-prerequisites:
    name: Isolated amd64 KVM prerequisites
    if: github.event_name == 'workflow_dispatch' && inputs.sandbox-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.0"
          package-manager-cache: false
      - name: Prove real KVM_CREATE_VM using existing executor access
        run: node scripts/ci/kvm-preflight.mjs
        env:
          TANK_QUALIFICATION_EVIDENCE: ${{ runner.temp }}/sandbox-qualification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sandbox-kvm-prerequisites-${{ github.sha }}
          path: ${{ runner.temp }}/sandbox-qualification/*.json
          if-no-files-found: error

  sandbox-vendored:
    name: Vendored sandbox TypeScript and SQL qualification
    if: github.event_name == 'workflow_dispatch' && inputs.sandbox-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.0"
          package-manager-cache: false
      - name: Native qualification evidence and exact input-settlement regressions
        run: node --test scripts/ci/qualification-evidence.test.mjs
      - name: Install the actual frozen vendored workspace
        working-directory: vendor/openma
        run: |
          corepack enable
          corepack prepare pnpm@11.0.8 --activate
          pnpm install --frozen-lockfile
      - name: Typecheck touched vendored runtime composition
        run: node scripts/ci/vendored-typecheck.mjs
        env:
          TANK_QUALIFICATION_EVIDENCE: ${{ runner.temp }}/sandbox-qualification
      - name: Actual SQL coordinator upgrade recovery integration
        if: ${{ !cancelled() }}
        run: node scripts/ci/qualify-sandbox-sql.mjs
        env:
          TANK_QUALIFICATION_EVIDENCE: ${{ runner.temp }}/sandbox-qualification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sandbox-vendored-${{ github.sha }}
          path: ${{ runner.temp }}/sandbox-qualification/
          if-no-files-found: error

  sandbox-native:
    name: Real isolated KVM Managed API A-to-B runs
    if: github.event_name == 'workflow_dispatch' && inputs.sandbox-qualification && github.repository == 'freQuensy23-coder/Tank' && github.actor == 'freQuensy23-coder'
    needs: sandbox-kvm-prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.0"
          package-manager-cache: false
      - name: Prove KVM in the actual qualification executor
        run: |
          node --input-type=module -e 'import {qualificationExecutor} from "./scripts/ci/qualification-executor.mjs"; console.log(await qualificationExecutor());'
          node scripts/ci/kvm-preflight.mjs
        env:
          TANK_QUALIFICATION_EVIDENCE: ${{ runner.temp }}/sandbox-qualification
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build the shipping sandbox as a coherent amd64 OCI layout
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/sandbox.Dockerfile
          platforms: linux/amd64
          provenance: false
          outputs: type=oci,dest=${{ runner.temp }}/sandbox-base.tar
          cache-from: type=gha,scope=tank-sandbox
      - name: Build genuine executable and Python-package A and B image layers
        run: |
          mkdir -p "$RUNNER_TEMP/sandbox-base"
          tar -xf "$RUNNER_TEMP/sandbox-base.tar" -C "$RUNNER_TEMP/sandbox-base"
          rm "$RUNNER_TEMP/sandbox-base.tar"
          for version in A B; do
            docker buildx build --platform linux/amd64 --provenance=false \
              --build-context "sandbox=oci-layout://$RUNNER_TEMP/sandbox-base" \
              --file scripts/ci/qualification-sandbox.Dockerfile \
              --build-arg "IMAGE_VERSION=$version" \
              --output "type=oci,dest=$RUNNER_TEMP/sandbox-$version.tar" .
            mkdir -p "$RUNNER_TEMP/sandbox-$version"
            tar -xf "$RUNNER_TEMP/sandbox-$version.tar" -C "$RUNNER_TEMP/sandbox-$version"
            rm "$RUNNER_TEMP/sandbox-$version.tar"
          done
          cp -al "$RUNNER_TEMP/sandbox-B" "$RUNNER_TEMP/sandbox-metadata"
          node --input-type=module -e 'import {readFileSync,unlinkSync,writeFileSync} from "node:fs"; const p=process.env.RUNNER_TEMP+"/sandbox-metadata/index.json"; const index=JSON.parse(readFileSync(p,"utf8")); index.annotations={...index.annotations,"org.tank.qualification.metadata":"export-only"}; unlinkSync(p); writeFileSync(p,JSON.stringify(index,null,2)+"\n");'
      - name: Build and load the exact candidate OpenMA service
        id: candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: vendor/openma
          file: vendor/openma/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-contexts: sandbox=${{ runner.temp }}/sandbox-A
          build-args: SKIP_CONSOLE=1
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: tank-qualification:${{ github.sha }}
          cache-from: type=gha,scope=tank-openma
      - name: Execute two real same-session native upgrades using only fresh owned services
        run: node scripts/ci/managed-upgrade-qualification.mjs
        env:
          TANK_QUALIFICATION_IMAGE: ${{ steps.candidate.outputs.imageid }}
          TANK_QUALIFICATION_EVIDENCE: ${{ runner.temp }}/sandbox-qualification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sandbox-native-${{ github.sha }}
          path: ${{ runner.temp }}/sandbox-qualification/
          if-no-files-found: error

  sandbox-acceptance:
    name: Sandbox upgrade acceptance
    if: always() && github.event_name == 'workflow_dispatch' && inputs.sandbox-qualification
    needs: [sandbox-kvm-prerequisites, sandbox-vendored, sandbox-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse failed or skipped prerequisites and native executions
        env:
          KVM_RESULT: ${{ needs.sandbox-kvm-prerequisites.result }}
          VENDORED_RESULT: ${{ needs.sandbox-vendored.result }}
          NATIVE_RESULT: ${{ needs.sandbox-native.result }}
        run: |
          test "$KVM_RESULT" = success
          test "$VENDORED_RESULT" = success
          test "$NATIVE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sandbox-native-${{ github.sha }}
          path: ${{ runner.temp }}/sandbox-native-evidence
      - name: Require complete exact-head native evidence, never a partial green
        run: node scripts/ci/check-sandbox-acceptance.mjs
        env:
          TANK_QUALIFICATION_EVIDENCE: ${{ runner.temp }}/sandbox-native-evidence

  publish:
    if: github.event_name == 'push'
    needs: [lint-python, lint-go, mypy, test, capture, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested images with the branch
        run: |
          for name in tank tank-capture tank-openma tank-postgres tank-clickhouse; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}/$name"
            docker buildx imagetools create -t "$image:$GITHUB_REF_NAME" "$image:$GITHUB_SHA"
          done
