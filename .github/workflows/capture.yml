name: capture

# tank-capture (capture/README.md): Go vet and tests, and the parity harness that feeds the
# same recorded exchange frames through tank.market and the Go port.
on:
  pull_request:
    paths:
      - .github/workflows/capture.yml
      - capture/**
      - scripts/capture/**
      - src/tank/market/**
      - src/tank/market_schema.py
      - src/tank/market_storage.py
      - src/tank/migrations/**
      - tests/test_capture*.py
      - uv.lock
  push:
    paths:
      - .github/workflows/capture.yml
      - capture/**
      - scripts/capture/**
      - src/tank/market/**
      - src/tank/market_schema.py
      - src/tank/market_storage.py
      - src/tank/migrations/**
      - tests/test_capture*.py
      - uv.lock

permissions:
  contents: read

concurrency:
  group: capture-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  # A disposable cluster of this job only; pytest accepts only tank_test* databases.
  TANK_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/tank_test

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: capture/go.mod
          cache-dependency-path: capture/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Migrated test database
        run: |
          uv sync
          uv run python -c "import psycopg; psycopg.connect('postgresql://postgres@localhost:5432/postgres', autocommit=True).execute('CREATE DATABASE tank_test')"
          TANK_DATABASE_URL="$TANK_TEST_DATABASE_URL" TANK_DATA_DIR="$RUNNER_TEMP/tank-data" uv run tank db migrate
      - name: go vet
        working-directory: capture
        run: go vet ./...
      - name: go test
        working-directory: capture
        run: go test ./...

  parity:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: capture/go.mod
          cache-dependency-path: capture/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Build capture-parity
        working-directory: capture
        run: go build -o bin/capture-parity ./cmd/capture-parity
      - name: Parity with the Python reference
        run: uv run python scripts/capture/parity.py --check --go capture/bin/capture-parity
      - name: Go schema copy matches tank.market_schema
        run: uv run python scripts/capture/gen_schema.py --check
      - name: Test database
        run: uv run python -c "import psycopg; psycopg.connect('postgresql://postgres@localhost:5432/postgres', autocommit=True).execute('CREATE DATABASE tank_test')"
      - name: Capture tests
        run: uv run pytest -q tests/test_capture_parity.py tests/test_capture_shadow_compare.py
