name: Docker images

on:
  pull_request:
    paths:
      - .github/workflows/docker-images.yml
      - Dockerfile
      - .dockerignore
      - capture/**
      - deploy/**
      - src/**
      - pyproject.toml
      - uv.lock
      - scripts/ci/**
      - tests/test_deploy.py
      - tests/test_openma_deployment_composer.py
      - tests/test_openma_browser_worker.py
      - tests/test_openma_docker_build.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Docker image (${{ matrix.kind }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: tank
            context: .
            file: Dockerfile
          - kind: capture
            context: ./capture
            file: capture/Dockerfile
          - kind: sandbox
            context: .
            file: deploy/sandbox.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check cold-build disk capacity
        shell: bash
        run: |
          task_docker_root=$(docker info --format '{{.DockerRootDir}}')
          sudo python3 - "$task_docker_root" "$RUNNER_TEMP" <<'PYTHON'
          import shutil
          import sys
          for path in sys.argv[1:]:
              available = shutil.disk_usage(path).free
              print(f"{path}: {available:,} bytes available")
              assert available >= 12_000_000_000, "Cold image build requires 12 GB free or separate builder storage"
          PYTHON
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify real build-context filters
        if: matrix.kind != 'capture'
        run: python3 scripts/ci/docker-context.py "${{ matrix.kind }}"
      - name: Build actual image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          build-args: GIT_SHA=${{ github.sha }}
          load: true
          push: false
          provenance: false
          tags: tank-ci:${{ matrix.kind }}
          cache-from: type=gha,scope=tank-image-${{ matrix.kind }}
          cache-to: type=gha,mode=max,scope=tank-image-${{ matrix.kind }}
      - name: Smoke actual image without external network
        run: python3 scripts/ci/docker-smoke.py "${{ matrix.kind }}" --image "tank-ci:${{ matrix.kind }}" --revision "${{ github.sha }}"

  openma:
    name: OpenMA dependency build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Focused deployment and Docker recipe tests
        run: uv run --frozen --extra dev pytest -q tests/test_deploy.py tests/test_openma_deployment_composer.py tests/test_openma_browser_worker.py tests/test_openma_docker_build.py
      - name: Fetch pinned official upstream
        run: |
          git init "$RUNNER_TEMP/openma-upstream"
          git -C "$RUNNER_TEMP/openma-upstream" remote add origin https://github.com/openma-ai/open-managed-agents.git
          git -C "$RUNNER_TEMP/openma-upstream" fetch --depth 1 origin 85d5361f535c7221de975838dc48444e468cc02e
          git -C "$RUNNER_TEMP/openma-upstream" checkout --detach FETCH_HEAD
      - name: Prepare guarded dependency build
        run: python3 scripts/ci/openma-docker-check.py --source "$RUNNER_TEMP/openma-upstream" --destination "$RUNNER_TEMP/openma-deps"
      - name: Build actual generated dependency stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/openma-deps
          file: ${{ runner.temp }}/openma-deps/apps/main-node/Dockerfile.tank-ci
          target: deps
          build-args: SKIP_CONSOLE=1
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: tank-ci:openma-deps
          cache-from: type=gha,scope=tank-openma-deps
          cache-to: type=gha,mode=max,scope=tank-openma-deps
      - name: Smoke pinned dependency environment offline
        run: python3 scripts/ci/docker-smoke.py openma-deps --image tank-ci:openma-deps
