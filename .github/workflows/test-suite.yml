name: Test suite

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  python-unit:
    name: Python unit
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 4 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.7"
          python-version: "3.13.13"
          enable-cache: true
      - run: uv sync --python 3.13.13 --frozen --extra dev --group x-reader
      - name: Stage exact retained capture inputs
        run: uv run --frozen --extra dev python scripts/ci/stage_retained_fixtures.py
      - name: Check CI helper style
        run: uv run --frozen --extra dev ruff check scripts/ci
      - name: Verify the frozen actor-only dependency export
        run: uv run --frozen --extra dev --group x-reader python scripts/ci/check_actor_dependencies.py --root .
      - name: Record the complete offline unit collection
        run: uv run --frozen --extra dev --group x-reader pytest -p scripts.ci.collect_units -q --collect-only -m 'not integration'
      - name: Run the selected complete unit partition
        run: uv run --frozen --extra dev --group x-reader pytest -p scripts.ci.unit_shard --ci-unit-shard "${{ matrix.shard }}/2" -q -n auto --dist loadfile -m 'not integration' --junitxml=.test-results/unit.xml
      - name: Package the exact selected X worker source
        if: matrix.shard == 0
        run: |
          sha=$(git rev-parse HEAD)
          archive="$RUNNER_TEMP/ci-publisher-archive"
          mkdir "$archive"
          git archive "$sha" src scripts/deploy pyproject.toml uv.lock > "$RUNNER_TEMP/ci-publisher-archive.tar"
          tar -xf "$RUNNER_TEMP/ci-publisher-archive.tar" -C "$archive"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$archive/src" uv run --frozen --extra dev --group x-reader python -m tank.deployment.cli package \
            --orchestrator-sha "$sha" --selected-release-sha "$sha" --runtime-root "$archive" \
            --repository "$PWD" --destination "$PWD/.test-results/x-worker-release" \
            --image-repository "ghcr.io/${GITHUB_REPOSITORY,,}/tank"
      - name: Require complete unit partition, timing and zero skips
        run: >-
          uv run --frozen --extra dev python -m scripts.ci.check_unit_results
          --bundle .test-results --plan scripts/ci/unit_shards.json
          --source-sha "$GITHUB_SHA" --shard "${{ matrix.shard }}/2"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: python-unit-results-attempt-${{ github.run_attempt }}-${{ matrix.shard }}
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: error

  python-unit-complete:
    name: Python unit complete
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 4 || 16 }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.7"
          python-version: "3.13.13"
          enable-cache: true
      - run: uv sync --python 3.13.13 --frozen --extra dev
      - name: Require this workflow attempt's two successful unit jobs
        id: unit-ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --extra dev python -m scripts.ci.unit_completion wait --receipt .test-results/unit-ready.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        timeout-minutes: 1
        with:
          artifact-ids: ${{ steps.unit-ready.outputs.artifact_ids }}
          path: .test-results/unit-shards
      - name: Require the full unit union and timing within the total post-readiness minute
        timeout-minutes: 1
        run: uv run --frozen --extra dev python -m scripts.ci.unit_completion verify --receipt .test-results/unit-ready.json --artifacts .test-results/unit-shards

  python-integration:
    name: Python integration
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 4 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      CLICKHOUSE_TEST_URL: http://tank_ci:tank-ci-disposable@127.0.0.1:8123
      TANK_CI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.0"
          package-manager-cache: false
          cache: npm
          cache-dependency-path: tests/node-gateway/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.7"
          python-version: "3.13.13"
          enable-cache: true
          cache-python: true
          cache-suffix: integration-frozen-dev-x-reader-v2
      - run: uv sync --python 3.13.13 --frozen --extra dev --group x-reader
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.14"
          cache-dependency-path: capture/go.sum
      - name: Verify the frozen actor-only dependency export
        run: uv run --frozen --extra dev --group x-reader python scripts/ci/check_actor_dependencies.py --root .
      - name: Stage exact retained capture inputs
        run: uv run --frozen --extra dev python scripts/ci/stage_retained_fixtures.py
      - name: Stage exact supplementary source captures
        run: uv run --frozen --extra dev python tests/fixtures/supplementary-sources/stage.py
      - name: Join pinned setup and the complete integration collection
        run: uv run --frozen --extra dev --group x-reader python -m scripts.ci.prepare_integration_setup
      - name: Prepare the isolated ClickHouse schema
        run: uv run --frozen --extra dev python scripts/ci/prepare_clickhouse.py
      - name: Provision disposable worker databases and read-only role
        run: uv run --frozen --extra dev python -m scripts.ci.prepare_postgres
        env:
          CI_POSTGRES_DSN: postgresql://postgres:tank-ci-disposable@127.0.0.1:5432/tank_test_ci_admin
          PYTHONPATH: tests
      - name: Run all integration cases
        run: uv run --frozen --extra dev --group x-reader pytest -p parallel_postgres -p integration_shard --ci-shard "${{ matrix.shard }}/3" -q -n auto --dist loadfile --no-loadscope-reorder -m integration --postgres-schema-template "$TANK_CI_SCHEMA_TEMPLATE" --timeout=300 --junitxml=.test-results/integration.xml
        env:
          PYTHONPATH: scripts/ci:tests
      - name: Require the complete integration collection with zero skips
        run: uv run --frozen --extra dev python -m scripts.ci.check_integration_results .test-results/integration.xml --collection .test-results/integration-collection.json --shard "${{ matrix.shard }}/3"
      - name: Collect logs and remove only this launch's owned ClickHouse container
        if: always()
        run: uv run --frozen --extra dev python -m scripts.ci.managed_clickhouse cleanup
      - name: Collect logs and remove only the owned PostgreSQL container
        if: always()
        run: |
          if [[ -f .test-results/postgres-container-id ]]; then
            container_id="$(cat .test-results/postgres-container-id)"
            owner="$(docker inspect --format '{{index .Config.Labels "tank.ci-owner"}}' "$container_id")"
            if [[ "$owner" != "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]]; then
              echo "::error::Refusing to remove an unowned PostgreSQL container"
              exit 1
            fi
            log_status=0
            docker logs "$container_id" > .test-results/postgres.log 2>&1 || log_status=$?
            docker rm --force "$container_id"
            exit "$log_status"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: python-integration-results-attempt-${{ github.run_attempt }}-${{ matrix.shard }}
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: error

  python-integration-complete:
    name: Python integration complete
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 4 || 21 }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.7"
          python-version: "3.13.13"
          enable-cache: true
      - run: uv sync --python 3.13.13 --frozen --extra dev
      - name: Require this workflow attempt's three successful integration jobs
        id: integration-ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --extra dev python -m scripts.ci.integration_completion wait --receipt .test-results/integration-ready.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        timeout-minutes: 1
        with:
          artifact-ids: ${{ steps.integration-ready.outputs.artifact_ids }}
          path: .test-results/shards
      - name: Require the full integration union within the total post-readiness minute
        timeout-minutes: 1
        run: uv run --frozen --extra dev python -m scripts.ci.integration_completion verify --receipt .test-results/integration-ready.json --artifacts .test-results/shards

  node-local:
    name: Node local units and contracts
    env:
      TANK_FILE_IO_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.7"
          python-version: "3.13.13"
          enable-cache: true
      - run: uv sync --python 3.13.13 --frozen --extra dev
      - run: npm ci --prefix scripts/typescript --ignore-scripts --no-audit --no-fund
      - name: Check migrated TypeScript quality tools
        run: scripts/typescript/node_modules/.bin/tsc -p scripts/typescript/tsconfig.json
      - name: Sandbox Python for the file I/O tests
        run: |
          uv python install 3.13.13
          echo "TANK_FILE_IO_TEST_PYTHON=$(uv python find --managed-python 3.13.13)" >> "$GITHUB_ENV"
      - name: Local JavaScript units
        run: node scripts/test-node.mjs local-unit
      - name: Local JavaScript contracts
        run: node scripts/test-node.mjs local-contract
      - name: Sandbox qualification evidence gate regressions
        run: node --test scripts/ci/qualification-evidence.test.mjs


  node-persistence:
    name: Node persistence contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      TANK_TEST_DATABASE_URL: postgresql://tank_ci:tank-ci-disposable@127.0.0.1:5432/tank_test_openma_persistence
      TANK_OPENMA_PERSISTENCE_DATABASE_HOST: 127.0.0.1
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: tank_ci
          POSTGRES_PASSWORD: tank-ci-disposable
          POSTGRES_DB: tank_test_openma_persistence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tank_ci -d tank_test_openma_persistence"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.0"
          package-manager-cache: false
      - name: Verify frozen upstream persistence dependency closure
        run: node scripts/openma-persistence/verify-lock.mts
      - name: Install exact persistence dependencies without lifecycle scripts
        run: npm ci --prefix scripts/openma-persistence --ignore-scripts --no-audit --no-fund
      - name: Install the declared TypeScript compiler
        run: npm ci --prefix scripts/typescript --ignore-scripts --no-audit --no-fund
      - name: Check strict persistence contracts and actual PostgreSQL behavior
        run: |
          mkdir -p .test-results
          set -o pipefail
          node scripts/openma-persistence/run.mts | tee .test-results/openma-persistence.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: openma-persistence-results
          path: .test-results/openma-persistence.log
          include-hidden-files: true
          if-no-files-found: error

  node-public-history:
    name: Node public history contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      TANK_TEST_DATABASE_URL: postgresql://tank_ci:tank-ci-disposable@127.0.0.1:5432/tank_test_openma_history
      TANK_OPENMA_PERSISTENCE_DATABASE_HOST: 127.0.0.1
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: tank_ci
          POSTGRES_PASSWORD: tank-ci-disposable
          POSTGRES_DB: tank_test_openma_history
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tank_ci -d tank_test_openma_history"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.7"
          python-version: "3.13.13"
          enable-cache: true
      - run: uv sync --python 3.13.13 --frozen --extra dev
      - name: Install existing frozen driver and TypeScript closures
        run: |
          node scripts/openma-persistence/verify-lock.mts
          npm ci --prefix scripts/openma-persistence --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/typescript --ignore-scripts --no-audit --no-fund
      - name: Verify and materialize frozen public history dependencies
        run: |
          set -o pipefail
          mkdir -p .test-results
          uv run --frozen --extra dev python -m scripts.openma_history.manifest --check
          uv run --frozen --extra dev python -m scripts.openma_history.setup \
            --cache "$RUNNER_TEMP/tank-openma-history-archives" \
            --report .test-results/openma-history-setup.json 2>&1 | tee .test-results/openma-history-setup.log
      - name: Full public strict, unchanged upstream module and actual PostgreSQL
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/tank-openma-history-home" "$RUNNER_TEMP/tank-openma-history-tmp"
          env -i HOME="$RUNNER_TEMP/tank-openma-history-home" \
            TMPDIR="$RUNNER_TEMP/tank-openma-history-tmp" PATH="$PATH" \
            TANK_TEST_DATABASE_URL="$TANK_TEST_DATABASE_URL" \
            TANK_OPENMA_PERSISTENCE_DATABASE_HOST="$TANK_OPENMA_PERSISTENCE_DATABASE_HOST" \
            node scripts/openma-persistence/history-module.mts | tee .test-results/openma-history.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: openma-public-history-results
          path: |
            .test-results/openma-history.log
            .test-results/openma-history-setup.json
            .test-results/openma-history-setup.log
          include-hidden-files: true
          if-no-files-found: error
