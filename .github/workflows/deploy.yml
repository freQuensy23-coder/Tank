name: deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit of main to deploy; empty deploys the head of main
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - name: Deploy only from main
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "deploy runs only from main, not $GITHUB_REF"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha=$(git rev-parse --verify "${INPUT_SHA:-HEAD}^{commit}")
          git merge-base --is-ancestor "$sha" origin/main || { echo "$sha is not a commit of main"; exit 1; }
          git checkout -q "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Wait for the CI images of the commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          for _ in $(seq 1 90); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push" \
              -q '[.workflow_runs[] | .status + "/" + (.conclusion // "")][0] // "missing"')
            case "$state" in
              completed/success) exit 0 ;;
              completed/*) echo "CI of ${SHA} finished: ${state}"; exit 1 ;;
            esac
            sleep 20
          done
          echo "CI of ${SHA} did not finish"; exit 1
      - name: Deploy on the production host
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_opts[@]}" compose.yaml scripts/deploy/deploy.sh "$SSH_USER@$SSH_HOST:/srv/tank-deploy/"
          printf '%s\n' "$APIFY_API_TOKEN" | ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
            'read -r t && test -n "$t" && cd /srv/tank-deploy && test -f .env && umask 077 && { grep -v "^APIFY_API_TOKEN=" .env > .env.new; [ $? -le 1 ]; } && printf "APIFY_API_TOKEN=%s\n" "$t" >> .env.new && mv .env.new .env'
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" "/srv/tank-deploy/deploy.sh $SHA"
